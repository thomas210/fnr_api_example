services:
  - type: web
    name: api-nuvem-aula
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: producao
      - key: CLOUD_PROVIDER
        value: render-paas
      - key: APP_VERSION
        value: 1.0.0
